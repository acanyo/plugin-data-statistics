apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-dataStatistics-settings
spec:
  forms:
    - group: basics
      label: 基本设置
      formSchema:
        - $el: div
          attrs:
            style:
              padding: "14px 16px"
              marginBottom: "18px"
              borderRadius: "10px"
              border: "1px solid #e4e4e7"
              backgroundColor: "#fafafa"
              display: "flex"
              flexDirection: "column"
              gap: "10px"
          children:
            - $el: div
              attrs:
                style:
                  display: "flex"
                  alignItems: "center"
                  justifyContent: "space-between"
                  flexWrap: "wrap"
                  gap: "8px"
              children:
                - $el: span
                  attrs:
                    style:
                      fontSize: "13px"
                      fontWeight: "600"
                      color: "#09090b"
                  children: "数据统计插件帮助与交流"
                - $el: a
                  attrs:
                    href: "https://docs.lik.cc"
                    target: "_blank"
                    rel: "noopener noreferrer"
                    style:
                      color: "#2563eb"
                      fontSize: "12.5px"
                      fontWeight: "500"
                      display: "inline-flex"
                      alignItems: "center"
                      gap: "4px"
                      textDecoration: "none"
                  children:
                    - $el: span
                      children: "查看帮助文档"
                    - $el: img
                      attrs:
                        src: "/plugins/data-statistics/assets/static/img/link.svg"
                        width: "13px"
                        height: "13px"
            - $el: div
              attrs:
                style:
                  display: "flex"
                  alignItems: "center"
                  flexWrap: "wrap"
                  gap: "8px"
              children:
                - $el: span
                  attrs:
                    style:
                      fontSize: "12px"
                      color: "#71717a"
                  children: "Halo 插件主题交流群："
                - $el: a
                  attrs:
                    href: "https://qm.qq.com/q/mPJeUOtG5G"
                    target: "_blank"
                    rel: "noopener noreferrer"
                    style:
                      color: "#1d4ed8"
                      fontSize: "12px"
                      fontWeight: "500"
                      padding: "4px 10px"
                      backgroundColor: "rgba(37, 99, 235, 0.08)"
                      borderRadius: "6px"
                      textDecoration: "none"
                      border: "1px solid rgba(37, 99, 235, 0.2)"
                  children: "加入群聊 766203360"
                - $el: button
                  attrs:
                    type: "button"
                    onclick: "navigator.clipboard.writeText('766203360').then(() => alert('群号已复制到剪贴板'))"
                    style:
                      color: "#3f3f46"
                      fontSize: "12px"
                      fontWeight: "500"
                      padding: "4px 10px"
                      backgroundColor: "#ffffff"
                      borderRadius: "6px"
                      border: "1px solid #d4d4d8"
                      cursor: "pointer"
                  children: "复制群号"
        - $formkit: checkbox
          name: enableMomentHeatmap
          id: enableMomentHeatmap
          key: enableMomentHeatmap
          label: 热力图统计瞬间
          value: false
          help: 开启后将瞬间并入热力图统计，悬浮提示增加"瞬间"明细
        - $formkit: color
          name: accentColor
          id: accentColor
          key: accentColor
          label: 主题强调色
          value: "#2563eb"
          help: 自定义前台统计组件的主强调色（留空或默认 #2563eb，暗色模式下自动适配对比度）
        - $formkit: date
          name: siteStartDate
          id: siteStartDate
          key: siteStartDate
          label: 建站日期
          help: 可选，用于计算站点已运行天数；留空将自动使用首篇文章的发布日期
    - group: umami
      label: umami设置
      formSchema:
        - $formkit: text
          name: siteUrl
          id: siteUrl
          key: siteUrl
          label: 站点地址
          placeholder: 请输入站点地址
          validation: "required"
          help: 启用后必填，格式：http(s)://你的 umami 地址 ，结尾无需加斜杠，未填写将无法推送
        - $formkit: text
          name: userName
          id: userName
          key: userName
          label: 用户名
          placeholder: 请输入你的 umami 用户名
          validation: "required"
          help: 必填，用于 API 获取你的 umamiAPI Token 使用
        - $formkit: password
          name: userPassWord
          id: userPassWord
          key: userPassWord
          label:  密码
          placeholder: 请输入你的 umami 密码
          validation: "required"
          help: 必填，用于 API 获取你的 umamiAPI Token 使用
        - $formkit: text
          name: websiteId
          id: websiteId
          key: websiteId
          label: 网站ID
          placeholder: 留空则自动获取第一个网站
          help: 可选，指定要统计的网站ID。如果留空，将自动使用第一个网站。可通过获取网站列表API查看所有网站ID
    - group: uptime
      label: uptime设置
      formSchema:
        - $formkit: text
          name: uptimeUrl
          id: uptimeUrl
          key: uptimeUrl
          label: 站点地址
          placeholder: 请输入站点地址
          help: 请输入 Uptime Kuma 状态页的完整 URL，例如：https://status.twouu.com/status/handsome
    - group: github
      label: Github统计设置
      formSchema:
        - $formkit: text
          name: proxyUrl
          id: proxyUrl
          key: proxyUrl
          label: 信息卡代理地址
          placeholder: 请输入代理地址
          value: "https://github-readme-stats.vercel.app/"
          help: 默认是 https://github-readme-stats.vercel.app/，国内不可用需要反向代理
        - $formkit: text
          name: graphProxyUrl
          id: graphProxyUrl
          key: graphProxyUrl
          label: 活力图代理地址
          placeholder: 请输入代理地址
          value: "https://github-readme-activity-graph.vercel.app/"
          help: 默认是 https://github-readme-activity-graph.vercel.app/，国内不可用需要反向代理
        - $formkit: text
          name: username
          id: username
          key: username
          label: GitHub名称
          placeholder: 请输入GitHub用户名
          validation: "required"
          help: 必填，GitHub的唯一用户名
